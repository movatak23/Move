<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move — Minha Linha</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Move">
<style>
  /* Paleta e medidas copiadas do app nativo (src/theme.js + telas), pro PWA ficar
     igual ao que o cliente já conhece: fundo preto, azul Move, cards de borda fina. */
  :root{
    --bg:#000; --bg2:#0e0e0e; --bg3:#161616; --bg4:#222;
    --border:#2b2b2b; --border2:#383838;
    /* Contraste subido de propósito: o cinza do app nativo (#888/#444) é ilegível pra
       quem enxerga pouco. Agora todo texto passa de 4.5:1 sobre o preto. */
    --text:#fff; --text2:#c3c3c3; --text3:#9a9a9a;
    --accent:#22c8ff; --accent-dim:rgba(34,200,255,.14);
    --green:#00e5a0; --yellow:#ffc14d; --red:#ff7b7b;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  /* TIPOGRAFIA FLUIDA: tudo em rem e a raiz acompanha a largura da tela. Assim o app
     fica grande no celular (que é onde ele vive) e não encolhe quando o navegador
     abre numa viewport larga — foi o que deixou tudo minúsculo no aparelho real. */
  html{font-size:clamp(19px, 5vw, 24px);
       -webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:dark;overflow-x:clip}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:clip;overflow-wrap:break-word;
       font:1rem/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding-bottom:calc(9rem + env(safe-area-inset-bottom))}
  button,a{touch-action:manipulation;font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  img{max-width:100%}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ── Cabeçalho de parceria (igual ao BrandingHeader do nativo) ── */
  .branding{display:flex;align-items:center;justify-content:center;background:var(--bg2);
            border-bottom:1px solid var(--border);padding:calc(.6rem + env(safe-area-inset-top)) .8rem .6rem;gap:.7rem}
  .branding .move{font-size:1.7rem;font-weight:900;color:var(--accent);letter-spacing:-2px;line-height:1}
  .branding img.move-logo{width:6.2rem;height:2.4rem;object-fit:contain}
  .branding .divisor{width:1px;height:2.2rem;background:var(--border2)}
  .branding .parceiro{max-width:9rem;text-align:center}
  .branding .parceria-txt{color:var(--text3);font-size:.6rem;text-transform:uppercase;letter-spacing:.8px;margin-bottom:.2rem}
  .branding .parceiro-nome{color:var(--text);font-size:.85rem;font-weight:700;line-height:1.2}
  .branding img.parceiro-logo{width:6.6rem;height:2.6rem;object-fit:contain}

  .conteudo{max-width:34rem;margin:0 auto}
  .cabecalho{display:flex;justify-content:space-between;align-items:center;padding:1rem .9rem .6rem;gap:.7rem}
  .cabecalho .logo{font-size:1.6rem;font-weight:900;color:var(--accent);letter-spacing:-1px}
  .cabecalho .ola{color:var(--text2);font-size:.95rem;text-align:right}
  .secao{color:var(--text3);font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
         margin:.5rem .9rem .4rem}

  /* ── Chips das linhas ── */
  .linhas-scroll{display:flex;gap:.5rem;overflow-x:auto;padding:0 .9rem .7rem;scrollbar-width:none}
  .linhas-scroll::-webkit-scrollbar{display:none}
  .chip{display:flex;align-items:center;gap:.45rem;flex:0 0 auto;background:var(--bg2);border:2px solid var(--border);
        border-radius:2rem;padding:.6rem .9rem;min-height:2.9rem;color:var(--text2);
        font-size:.9rem;font-weight:700;cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
  .chip .ponto{width:.55rem;height:.55rem;border-radius:50%;flex:0 0 auto}

  .card{background:var(--bg2);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin:0 .9rem .7rem}
  .card-topo{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap}
  .rotulo{color:var(--text3);font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:.25rem}
  .msisdn{color:var(--text);font-size:min(1.55rem,8vw);font-weight:800;font-variant-numeric:tabular-nums;
          line-height:1.15;white-space:nowrap}
  .selo{border:2px solid;border-radius:2rem;padding:.3rem .7rem;font-size:.72rem;font-weight:800;white-space:nowrap}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:.9rem}
  .val{color:var(--text);font-size:1rem;font-weight:600;line-height:1.3;hyphens:auto}

  .consumo{margin-bottom:1.1rem}
  .consumo:last-child{margin-bottom:0}
  .consumo-topo{display:flex;justify-content:space-between;gap:.6rem;margin-bottom:.4rem;flex-wrap:wrap}
  .consumo-nome{color:var(--text);font-size:1rem;font-weight:700}
  .consumo-val{color:var(--text2);font-size:.95rem;font-variant-numeric:tabular-nums;text-align:right}
  .barra{height:.6rem;background:var(--bg4);border-radius:.3rem;overflow:hidden}
  .barra>div{height:.6rem;border-radius:.3rem}

  /* ── Faixa "Faturas mensais", fixa acima das abas ── */
  .faturas{position:fixed;left:0;right:0;bottom:calc(4.4rem + env(safe-area-inset-bottom));z-index:19;
           display:flex;align-items:center;justify-content:space-between;gap:.7rem;width:100%;min-height:3.4rem;
           background:var(--bg2);border:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
           padding:.85rem 1.1rem;color:var(--text);font-size:1rem;font-weight:700;cursor:pointer}
  .faturas .seta{color:var(--accent);font-size:1.4rem}

  /* ── Abas ── */
  .abas{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--bg2);
        border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .abas button{flex:1;min-height:4.4rem;background:none;border:0;color:var(--text3);cursor:pointer;
               font-size:.7rem;font-weight:700;padding:.5rem .15rem;display:flex;flex-direction:column;
               align-items:center;justify-content:center;gap:.25rem;line-height:1.15}
  .abas button.on{color:var(--accent)}
  .abas svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ── Formulários e botões ── */
  label.campo{display:block;color:var(--text2);font-size:.8rem;font-weight:700;letter-spacing:.8px;
              text-transform:uppercase;margin-bottom:.4rem}
  input{width:100%;background:var(--bg3);border:2px solid var(--border);border-radius:.7rem;padding:.9rem;
        color:var(--text);font-size:1.15rem;outline:none;min-height:3.2rem}
  input:focus{border-color:var(--accent)}
  .btn{display:block;width:100%;background:var(--accent);color:#000;border:0;border-radius:.7rem;
       padding:1rem;min-height:3.4rem;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:.7rem}
  .btn:disabled{opacity:.6}
  .btn2{background:var(--bg2);color:var(--accent);border:2px solid var(--accent)}
  .btn3{background:var(--bg3);color:var(--text);border:2px solid var(--border)}
  .btn-sm{width:auto;display:inline-block;padding:.7rem .9rem;min-height:2.8rem;font-size:.95rem;margin-top:0}
  textarea{width:100%;background:var(--bg3);border:2px solid var(--border);border-radius:.7rem;color:var(--text);
           font-family:var(--mono);font-size:.9rem;padding:.8rem;word-break:break-all;line-height:1.5}
  .aviso{background:var(--accent-dim);border:2px solid var(--accent);border-radius:.9rem;padding:.9rem;
         margin:0 .9rem .7rem;font-size:.95rem;line-height:1.5}
  .erro{background:rgba(255,123,123,.14);border:2px solid var(--red);color:#ffc9c9;border-radius:.7rem;
        padding:.8rem .9rem;font-size:.95rem;margin-top:.7rem;line-height:1.45}
  .ok{background:rgba(0,229,160,.14);border:2px solid var(--green);color:var(--green);border-radius:.7rem;
      padding:.8rem .9rem;font-size:.95rem;margin-top:.7rem;line-height:1.45}
  .vazio{padding:2.6rem 1.2rem;text-align:center;color:var(--text2);font-size:1rem;line-height:1.6}
  .vazio .ic{font-size:2.4rem;display:block;margin-bottom:.6rem}
  .carregando{color:var(--text2);text-align:center;padding:1.6rem;font-size:1rem}
  a{color:var(--accent)}

  /* ── Tela de abertura (propaganda), igual ao nativo: 4s e "Continuar" ── */
  #tela-propaganda{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #tela-propaganda img{width:100%;height:100%;object-fit:cover;display:block}
  #tela-propaganda .contador{position:absolute;top:calc(20px + env(safe-area-inset-top));right:20px;
        background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);border-radius:20px;
        padding:6px 14px;color:#fff;font-size:13px;font-weight:700}
  #tela-propaganda .continuar{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));right:20px;
        background:var(--accent);color:#000;border:0;border-radius:24px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- ── TELA DE ABERTURA ────────────────────────────────────────────────────── -->
<div id="tela-propaganda" role="dialog" aria-label="Abertura do app Move">
  <img src="/propaganda.png" alt="Move 5G — seu app está carregando" width="1080" height="1920">
  <div class="contador" id="propaganda-contador" aria-live="off">4s</div>
  <button class="continuar" onclick="fecharPropaganda()">Continuar →</button>
</div>

<!-- ── ENTRAR ──────────────────────────────────────────────────────────────── -->
<div id="tela-login" style="display:none">
  <div class="conteudo" style="padding:32px 24px">
    <div style="text-align:center;margin:36px 0 34px">
      <div style="font-size:clamp(52px,16vw,72px);font-weight:900;color:var(--accent);letter-spacing:-4px;line-height:1">move</div>
      <div style="color:var(--text2);font-size:.95rem;margin-top:16px">Sua linha na palma da mão</div>
    </div>

    <div id="passo-cpf">
      <label class="campo" for="in-cpf">Seu CPF</label>
      <input id="in-cpf" name="cpf" type="tel" inputmode="numeric" placeholder="000.000.000-00"
             autocomplete="username" spellcheck="false" enterkeyhint="send">
      <button class="btn" id="btn-codigo" onclick="pedirCodigo()">Receber código no WhatsApp</button>
      <div style="color:var(--text3);font-size:.9rem;margin-top:14px;line-height:1.6">
        O código chega no WhatsApp do número da sua linha Move. Sem senha para decorar.
      </div>
    </div>

    <div id="passo-codigo" style="display:none">
      <label class="campo" for="in-codigo">Código enviado para <span id="destino-fone" style="color:var(--accent)"></span></label>
      <input id="in-codigo" name="codigo" type="tel" inputmode="numeric" maxlength="6" placeholder="000000"
             autocomplete="one-time-code" spellcheck="false" enterkeyhint="go"
             style="letter-spacing:9px;text-align:center;font-family:var(--mono);font-size:clamp(22px,8vw,28px)">
      <button class="btn" id="btn-entrar" onclick="entrar()">Entrar</button>
      <button class="btn btn3" onclick="voltarCpf()">Trocar CPF</button>
    </div>
    <div id="login-msg" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- ── APP ─────────────────────────────────────────────────────────────────── -->
<div id="tela-app" style="display:none">
  <header class="branding" id="branding">
    <div class="move" translate="no">move</div>
  </header>

  <div class="conteudo">
    <div class="cabecalho">
      <div class="logo" translate="no">move</div>
      <div class="ola" id="ola"></div>
    </div>

    <div id="banner-instalar" style="display:none"></div>

    <div id="pg-linha" role="region" aria-label="Minha linha" aria-live="polite"></div>
    <div id="pg-recarga" role="region" aria-label="Pacotes adicionais" aria-live="polite" style="display:none"></div>
    <div id="pg-reativar" role="region" aria-label="Reativar" aria-live="polite" style="display:none"></div>
    <div id="pg-historico" role="region" aria-label="Histórico" aria-live="polite" style="display:none"></div>
    <div id="pg-perfil" role="region" aria-label="Perfil" style="display:none"></div>
    <div id="pg-faturas" role="region" aria-label="Faturas mensais" aria-live="polite" style="display:none"></div>
  </div>

  <button class="faturas" id="faixa-faturas" onclick="irPara('faturas')">
    <span>📄 Faturas mensais</span><span class="seta" aria-hidden="true">›</span>
  </button>

  <nav class="abas" aria-label="Seções do app">
    <button id="aba-linha" class="on" onclick="irPara('linha')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M2 9a15 15 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1"/></svg>
      Minha Linha</button>
    <button id="aba-recarga" onclick="irPara('recarga')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      Pac. Adicionais</button>
    <button id="aba-reativar" onclick="irPara('reativar')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      Reativar</button>
    <button id="aba-historico" onclick="irPara('historico')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Histórico</button>
    <button id="aba-perfil" onclick="irPara('perfil')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
      Perfil</button>
  </nav>
</div>

<script>
// ── ESTADO ───────────────────────────────────────────────────────────────────
const S = {
  token: localStorage.getItem('move_cli_token') || null,
  cliente: JSON.parse(localStorage.getItem('move_cli_dados') || 'null'),
  cpf: null, linhas: [], linhaSel: null, consumo: null, pagina: 'linha',
  // Marca e suporte do VENDEDOR dono da linha (cada estado tem o seu)
  marca: null, suporte: null, suporteEhDoVendedor: false
};

async function api(metodo, rota, corpo) {
  const o = { method: metodo, headers: { 'Content-Type': 'application/json' } };
  if (S.token) o.headers['Authorization'] = 'Bearer ' + S.token;
  if (corpo) o.body = JSON.stringify(corpo);
  const r = await fetch(rota, o);
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token) { sair(); throw new Error('Sua sessão expirou. Entre de novo.'); }
  if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));
  return d;
}

const soDigitos = v => String(v || '').replace(/\D/g, '');
const fmtBRL = c => 'R$ ' + (Number(c || 0) / 100).toFixed(2).replace('.', ',');
const fmtData = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const primeiroNome = n => String(n || '').trim().split(/\s+/)[0] || '';
function fmtNum(ms) {
  const d = soDigitos(ms).replace(/^55/, '');
  return d.length >= 10 ? d.replace(/(\d{2})(\d{4,5})(\d{4})/, '($1) $2-$3') : (ms || '—');
}
function fmtMB(v) {
  const n = Number(v || 0);
  return n >= 1024 ? (n / 1024).toFixed(2) + ' GB' : n.toFixed(0) + ' MB';
}
const pct = (u, t) => t ? Math.min((Number(u) / Number(t)) * 100, 100) : 0;
function corStatus(status) {
  const s = String(status || '').toLowerCase();
  if (s.includes('active') || s.includes('ativ')) return 'var(--green)';
  if (s.includes('suspend') || s.includes('block') || s.includes('bloque')) return 'var(--yellow)';
  if (s.includes('cancel') || s.includes('inativ')) return 'var(--red)';
  return 'var(--text2)';
}
function msg(alvo, texto, tipo) {
  document.getElementById(alvo).innerHTML = texto ? `<div class="${tipo || 'erro'}">${texto}</div>` : '';
}

// ── TELA DE ABERTURA (4s, igual ao nativo) ───────────────────────────────────
let _propagandaTimer = null;
function abrirPropaganda(depois) {
  const tela = document.getElementById('tela-propaganda');
  const contador = document.getElementById('propaganda-contador');
  let segundos = 4;
  tela.style.display = 'block';
  contador.textContent = segundos + 's';
  _propagandaTimer = setInterval(() => {
    segundos--;
    contador.textContent = Math.max(segundos, 0) + 's';
    if (segundos <= 0) fecharPropaganda();
  }, 1000);
  tela._depois = depois;
}
function fecharPropaganda() {
  clearInterval(_propagandaTimer);
  const tela = document.getElementById('tela-propaganda');
  tela.style.display = 'none';
  const depois = tela._depois; tela._depois = null;
  if (depois) depois();
}

// ── LOGIN POR CÓDIGO NO WHATSAPP ─────────────────────────────────────────────
async function pedirCodigo() {
  const cpf = soDigitos(document.getElementById('in-cpf').value);
  if (cpf.length !== 11 && cpf.length !== 14) return msg('login-msg', 'Digite seu CPF completo.');
  const btn = document.getElementById('btn-codigo');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const r = await api('POST', '/api/cliente/otp/solicitar', { cpf });
    S.cpf = cpf;
    document.getElementById('destino-fone').textContent = r.destino;
    document.getElementById('passo-cpf').style.display = 'none';
    document.getElementById('passo-codigo').style.display = 'block';
    msg('login-msg', '');
    document.getElementById('in-codigo').focus();
  } catch (e) { msg('login-msg', e.message); }
  finally { btn.disabled = false; btn.textContent = 'Receber código no WhatsApp'; }
}

function voltarCpf() {
  document.getElementById('passo-codigo').style.display = 'none';
  document.getElementById('passo-cpf').style.display = 'block';
  msg('login-msg', '');
}

async function entrar() {
  const codigo = soDigitos(document.getElementById('in-codigo').value);
  if (codigo.length !== 6) return msg('login-msg', 'O código tem 6 dígitos.');
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await api('POST', '/api/cliente/otp/validar', { cpf: S.cpf, codigo });
    S.token = r.token; S.cliente = r.cliente;
    localStorage.setItem('move_cli_token', r.token);
    localStorage.setItem('move_cli_dados', JSON.stringify(r.cliente));
    document.getElementById('tela-login').style.display = 'none';
    abrirPropaganda(abrirApp);
  } catch (e) { msg('login-msg', e.message); }
  finally { btn.disabled = false; btn.textContent = 'Entrar'; }
}

function sair() {
  localStorage.removeItem('move_cli_token');
  localStorage.removeItem('move_cli_dados');
  S.token = null; S.cliente = null;
  document.getElementById('tela-app').style.display = 'none';
  document.getElementById('tela-login').style.display = 'block';
}

// ── NAVEGAÇÃO ────────────────────────────────────────────────────────────────
const PAGINAS = ['linha', 'recarga', 'reativar', 'historico', 'perfil', 'faturas'];
function irPara(pg) {
  S.pagina = pg;
  PAGINAS.forEach(p => { document.getElementById('pg-' + p).style.display = p === pg ? 'block' : 'none'; });
  ['linha', 'recarga', 'reativar', 'historico', 'perfil'].forEach(p => {
    const b = document.getElementById('aba-' + p);
    const ativo = p === pg;
    b.classList.toggle('on', ativo);
    if (ativo) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  // A faixa de faturas é atalho da tela principal (como no app nativo)
  document.getElementById('faixa-faturas').style.display = pg === 'linha' ? 'flex' : 'none';
  if (pg === 'faturas') carregarFaturas();
  if (pg === 'recarga') carregarRecarga();
  if (pg === 'reativar') renderReativar();
  if (pg === 'historico') carregarHistorico();
  if (pg === 'perfil') renderPerfil();
  window.scrollTo(0, 0);
}

function abrirApp() {
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-app').style.display = 'block';
  document.getElementById('ola').textContent = 'Olá, ' + primeiroNome(S.cliente?.nome);
  carregarLinha();
  carregarMarca();
  prepararInstalacao();
}

// ── MARCA DO VENDEDOR (cabeçalho "em parceria com") ──────────────────────────
async function carregarMarca() {
  try {
    const m = await api('GET', '/api/cliente/marca');
    S.marca = m;
    S.suporte = m.suporteWhatsapp || null;
    S.suporteEhDoVendedor = !!m.suporteEhDoVendedor;
    const box = document.getElementById('branding');
    const logoMove = m.moveLogoUrl
      ? `<img class="move-logo" src="${m.moveLogoUrl}" alt="Move 5G" width="108" height="42">`
      : '<div class="move" translate="no">move</div>';
    const parceiro = m.parceiroLogoUrl
      ? `<div class="divisor"></div><div class="parceiro"><div class="parceria-txt">em parceria com</div>
         <img class="parceiro-logo" src="${m.parceiroLogoUrl}" alt="${m.parceiroNome || 'Parceiro'}" width="118" height="46"></div>`
      : (m.parceiroNome
        ? `<div class="divisor"></div><div class="parceiro"><div class="parceria-txt">em parceria com</div>
           <div class="parceiro-nome">${m.parceiroNome}</div></div>`
        : '');
    box.innerHTML = logoMove + parceiro;
    if (S.pagina === 'perfil') renderPerfil();
  } catch { /* sem marca: segue a identidade Move */ }
}

// ── MINHA LINHA ──────────────────────────────────────────────────────────────
async function carregarLinha() {
  const box = document.getElementById('pg-linha');
  box.innerHTML = '<div class="carregando">Carregando sua linha...</div>';
  try {
    const r = await api('GET', '/api/cliente/linhas/' + soDigitos(S.cliente.cpf));
    S.linhas = r.linhas || [];
    if (!S.linhas.length) {
      box.innerHTML = '<div class="vazio"><span class="ic">📱</span>Nenhuma linha encontrada.<br>Entre em contato com a Move.</div>';
      return;
    }
    await selecionarLinha(S.linhas[0]);
  } catch (e) { box.innerHTML = `<div class="card" style="border-color:var(--red);color:var(--red)">${e.message}</div>`; }
}

async function selecionarLinha(l) {
  S.linhaSel = l; S.consumo = null;
  renderLinha();
  const ms = soDigitos(l.msisdn);
  if (ms) {
    try { S.consumo = await api('GET', '/api/cliente/consumo/' + ms); } catch {}
    if (S.linhaSel === l) renderLinha();
  }
}

function renderLinha() {
  const l = S.linhaSel || {};
  const plano = Array.isArray(l.plan) ? l.plan[l.plan.length - 1] : (l.plan || null);
  const cor = corStatus(l.status);

  const chips = S.linhas.length > 1 ? `
    <div class="secao">Minhas linhas</div>
    <div class="linhas-scroll">
      ${S.linhas.map((x, i) => `
        <button class="chip" aria-pressed="${x === l}" onclick="selecionarLinha(S.linhas[${i}])">
          <span class="ponto" style="background:${corStatus(x.status)}"></span>${fmtNum(x.msisdn)}
        </button>`).join('')}
    </div>` : '';

  document.getElementById('pg-linha').innerHTML = `
    ${chips}
    <div class="card">
      <div class="card-topo">
        <div>
          <div class="rotulo">Número</div>
          <div class="msisdn">${fmtNum(l.msisdn)}</div>
        </div>
        <span class="selo" style="color:${cor};border-color:${cor};background:${cor.replace('var(--', 'var(--')}1f">
          ${(l.status || '—').toUpperCase()}</span>
      </div>
      <div class="grade">
        <div><div class="rotulo">Plano</div><div class="val">${plano?.name || '—'}</div></div>
        <div><div class="rotulo">Vencimento</div><div class="val">${fmtData(plano?.expiration)}</div></div>
      </div>
      <div class="grade" style="margin-bottom:0">
        <div><div class="rotulo">Tipo</div><div class="val">${l.iccidType || 'SIM'}</div></div>
        <div><div class="rotulo">Ativação</div><div class="val">${fmtData(l.activationDate)}</div></div>
      </div>
    </div>

    <div class="secao">Consumo do mês</div>
    <div class="card">${renderConsumo(S.consumo)}</div>

    <div class="card">
      <div class="rotulo">ICCID</div>
      <div class="val" style="font-family:var(--mono);font-size:.8rem">${l.iccid || '—'}</div>
    </div>`;
}

function renderConsumo(c) {
  if (!c) return '<div class="carregando" style="padding:12px">Consumo não disponível</div>';
  const itens = [
    { nome: '📶 Dados', cor: 'var(--accent)', usado: c.data?.used, total: c.data?.total, fmt: fmtMB },
    { nome: '📞 Minutos', cor: 'var(--green)', usado: c.voice?.used, total: c.voice?.total, fmt: v => `${Number(v || 0)}`, sufixo: ' min' },
    { nome: '💬 SMS', cor: 'var(--yellow)', usado: c.sms?.used, total: c.sms?.total, fmt: v => `${Number(v || 0)}` },
  ];
  return itens.map(it => `
    <div class="consumo">
      <div class="consumo-topo">
        <span class="consumo-nome">${it.nome}</span>
        <span class="consumo-val">${it.fmt(it.usado)} / ${it.fmt(it.total)}${it.sufixo || ''}</span>
      </div>
      <div class="barra"><div style="width:${pct(it.usado, it.total)}%;background:${it.cor}"></div></div>
    </div>`).join('');
}

// ── FATURAS MENSAIS ──────────────────────────────────────────────────────────
async function carregarFaturas() {
  const box = document.getElementById('pg-faturas');
  box.innerHTML = '<div class="carregando">Buscando suas faturas...</div>';
  try {
    const r = await api('GET', '/api/cliente/cobrancas');
    const abertas = (r.cobrancas || []).filter(c => !c.pago);
    box.innerHTML = `<div class="secao">Faturas em aberto</div>` + (abertas.length
      ? abertas.map(c => `
        <div class="card">
          <div class="card-topo" style="margin-bottom:10px">
            <div>
              <div class="rotulo">${fmtNum(c.msisdn)}</div>
              <div class="msisdn" style="font-size:1.35rem">R$ ${Number(c.valor || 0).toFixed(2).replace('.', ',')}</div>
            </div>
            <span class="selo" style="color:var(--yellow);border-color:var(--yellow)">VENCE ${fmtData(c.vencimento)}</span>
          </div>
          <div style="color:var(--text2);font-size:.9rem">${c.plano || ''}</div>
          ${c.pixCode ? `<textarea readonly rows="3" style="margin-top:12px">${c.pixCode}</textarea>
            <button class="btn" onclick="copiar(${JSON.stringify(c.pixCode).replace(/"/g, '&quot;')}, this)">Copiar código pix</button>` : ''}
          ${c.url ? `<a class="btn btn3" style="text-align:center;text-decoration:none" href="${c.url}" target="_blank" rel="noopener">Abrir boleto</a>` : ''}
          ${c.barcode && !c.pixCode ? `<textarea readonly rows="2" style="margin-top:12px">${c.barcode}</textarea>
            <button class="btn btn3" onclick="copiar(${JSON.stringify(c.barcode).replace(/"/g, '&quot;')}, this)">Copiar linha digitável</button>` : ''}
        </div>`).join('')
      : '<div class="vazio"><span class="ic">🎉</span>Você não tem faturas em aberto.</div>');
  } catch (e) { box.innerHTML = `<div class="card" style="border-color:var(--red);color:var(--red)">${e.message}</div>`; }
}

function copiar(texto, btn) {
  navigator.clipboard.writeText(texto).then(() => {
    const antes = btn.textContent;
    btn.textContent = '✔ Copiado!';
    setTimeout(() => btn.textContent = antes, 2000);
  }).catch(() => alert('Copie manualmente: ' + texto));
}

// ── PAC. ADICIONAIS ──────────────────────────────────────────────────────────
// O servidor só oferece pacote de valor igual ou maior que o plano atual, e recusa
// de novo na hora de cobrar — a tela aqui só explica a regra.
async function carregarRecarga() {
  const box = document.getElementById('pg-recarga');
  const ms = soDigitos(S.linhaSel?.msisdn);
  if (!ms) { box.innerHTML = '<div class="vazio">Selecione uma linha em Minha Linha.</div>'; return; }
  box.innerHTML = '<div class="carregando">Carregando pacotes...</div>';
  try {
    const planos = await api('GET', '/api/cliente/planos-recarga/' + ms);
    if (!planos.length) { box.innerHTML = '<div class="vazio"><span class="ic">📦</span>Nenhum pacote disponível para a sua linha agora.</div>'; return; }
    box.innerHTML = `
      <div class="aviso">Pacotes para <b style="color:var(--accent)">${fmtNum(ms)}</b>. Mostramos só os de valor
        igual ou maior que o seu plano atual — assim você nunca perde benefício.</div>
      ${planos.map(p => `
        <div class="card">
          <div class="card-topo" style="margin-bottom:0">
            <div>
              <div class="val" style="font-size:1.05rem;font-weight:700">${p.name || p.nome}</div>
              <div style="color:var(--text3);font-size:.8rem">${p.durationTime ? p.durationTime + ' dias' : ''}</div>
            </div>
            <div style="text-align:right">
              <div style="color:var(--accent);font-weight:800;font-size:1.1rem">${fmtBRL(p.value)}</div>
              <button class="btn btn-sm" style="margin-top:6px"
                onclick="escolherPagamento('${p.idPlanExternal || p.id}', ${JSON.stringify(p.name || p.nome).replace(/"/g, '&quot;')}, ${p.value || 0})">
                Contratar</button>
            </div>
          </div>
        </div>`).join('')}
      <div id="recarga-resultado"></div>`;
  } catch (e) { box.innerHTML = `<div class="card" style="border-color:var(--red);color:var(--red)">${e.message}</div>`; }
}

function escolherPagamento(planoId, planoNome, valor) {
  document.getElementById('recarga-resultado').innerHTML = `
    <div class="card">
      <div class="rotulo">Como você quer pagar</div>
      <div class="val" style="font-size:1.05rem;font-weight:700;margin-bottom:10px">${planoNome} — ${fmtBRL(valor)}</div>
      <button class="btn" onclick="recarregar('${planoId}', ${JSON.stringify(planoNome).replace(/"/g, '&quot;')}, 'pix', this)">Pix</button>
      <button class="btn btn3" onclick="recarregar('${planoId}', ${JSON.stringify(planoNome).replace(/"/g, '&quot;')}, 'billet', this)">Boleto</button>
      <button class="btn btn3" onclick="recarregar('${planoId}', ${JSON.stringify(planoNome).replace(/"/g, '&quot;')}, 'credit', this)">Cartão de crédito</button>
      <div id="pagamento-saida"></div>
    </div>`;
  document.getElementById('recarga-resultado').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function recarregar(planoId, planoNome, pagamento, btn) {
  const ms = soDigitos(S.linhaSel?.msisdn);
  btn.disabled = true; const antes = btn.textContent; btn.textContent = 'Gerando...';
  try {
    const r = await api('POST', '/api/cliente/recarregar', { msisdn: ms, plano_id: planoId, plano_nome: planoNome, pagamento });
    let html = '<div class="ok">Pedido gerado! Conclua o pagamento abaixo.</div>';
    if (r.pix?.code) html += `<textarea readonly rows="4" style="margin-top:12px">${r.pix.code}</textarea>
      <button class="btn" onclick="copiar(${JSON.stringify(r.pix.code).replace(/"/g, '&quot;')}, this)">Copiar código pix</button>`;
    if (r.billet?.barcode) html += `<textarea readonly rows="2" style="margin-top:12px">${r.billet.barcode}</textarea>`;
    if (r.billet?.url) html += `<a class="btn btn3" style="text-align:center;text-decoration:none" href="${r.billet.url}" target="_blank" rel="noopener">Abrir boleto</a>`;
    if (r.paymentLink) html += `<a class="btn" style="text-align:center;text-decoration:none" href="${r.paymentLink}" target="_blank" rel="noopener">Pagar com cartão</a>
      <div style="color:var(--text3);font-size:.8rem;margin-top:8px">A página do cartão é da operadora Bora. A Move não guarda o número do seu cartão.</div>`;
    document.getElementById('pagamento-saida').innerHTML = html;
  } catch (e) {
    document.getElementById('pagamento-saida').innerHTML = `<div class="erro">${e.message}</div>`;
  } finally { btn.disabled = false; btn.textContent = antes; }
}

// ── REATIVAR ─────────────────────────────────────────────────────────────────
function renderReativar() {
  const l = S.linhaSel || {};
  const ativa = String(l.status || '').toLowerCase().includes('active');
  document.getElementById('pg-reativar').innerHTML = !l.msisdn
    ? '<div class="vazio">Selecione uma linha em Minha Linha.</div>'
    : ativa
      ? `<div class="vazio"><span class="ic">✅</span>Sua linha ${fmtNum(l.msisdn)} está ativa.<br>
         Nada a reativar por aqui.</div>`
      : `<div class="card">
           <div class="rotulo">Linha inativa</div>
           <div class="val" style="margin:6px 0 4px">${fmtNum(l.msisdn)}</div>
           <div style="color:var(--text2);font-size:.9rem">Reative com o mesmo plano que você já usava.</div>
           <button class="btn" onclick="reativar(this)">Reativar minha linha</button>
           <div id="reativar-saida"></div>
         </div>`;
}

async function reativar(btn) {
  const ms = soDigitos(S.linhaSel?.msisdn);
  btn.disabled = true; btn.textContent = 'Reativando...';
  try {
    const r = await api('POST', `/api/cliente/linha/${ms}/reativar`, {});
    let html = '<div class="ok">Reativação iniciada! Conclua o pagamento se for pedido.</div>';
    if (r.pix?.code) html += `<textarea readonly rows="4" style="margin-top:12px">${r.pix.code}</textarea>
      <button class="btn" onclick="copiar(${JSON.stringify(r.pix.code).replace(/"/g, '&quot;')}, this)">Copiar código pix</button>`;
    if (r.paymentLink) html += `<a class="btn" style="text-align:center;text-decoration:none" href="${r.paymentLink}" target="_blank" rel="noopener">Pagar com cartão</a>`;
    document.getElementById('reativar-saida').innerHTML = html;
  } catch (e) {
    document.getElementById('reativar-saida').innerHTML = `<div class="erro">${e.message}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Reativar minha linha'; }
}

// ── INSTALAÇÃO NA TELA DE INÍCIO ─────────────────────────────────────────────
// Android/Chrome deixa abrir o diálogo; a Apple não expõe API, então no iPhone o app
// ENSINA o caminho em vez de fingir um botão que não existe.
let promptInstalar = null;
const ehAndroid = /android/i.test(navigator.userAgent);
const ehIOS = !ehAndroid && /iphone|ipad|ipod/i.test(navigator.userAgent);
const ehSafari = ehIOS && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
const jaInstalado = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); promptInstalar = e;
  if (S.token) prepararInstalacao();
});
window.addEventListener('appinstalled', () => {
  promptInstalar = null;
  document.getElementById('banner-instalar').style.display = 'none';
});

function prepararInstalacao() {
  const banner = document.getElementById('banner-instalar');
  if (jaInstalado || localStorage.getItem('move_cli_dispensou') === '1') { banner.style.display = 'none'; return; }
  if (!promptInstalar && !ehIOS) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  banner.innerHTML = `<div class="aviso">
      <b style="color:var(--accent)">📲 Instale o app da Move</b>
      <div id="banner-instalar-corpo"></div>
      <button class="btn btn3 btn-sm" style="margin-top:10px" onclick="dispensarInstalacao()">Agora não</button>
    </div>`;
  renderBotaoInstalar('banner-instalar-corpo');
}

function renderBotaoInstalar(alvoId) {
  const alvo = document.getElementById(alvoId);
  if (!alvo) return;
  if (jaInstalado) { alvo.innerHTML = '<div class="ok" style="margin-top:8px">App já instalado neste aparelho ✔</div>'; return; }
  if (promptInstalar) {
    alvo.innerHTML = '<button class="btn" onclick="instalarAgora(this)">Instalar agora</button>';
  } else if (ehIOS && ehSafari) {
    alvo.innerHTML = `<div style="color:var(--text2);font-size:.9rem;margin-top:8px;line-height:1.6">
      1. Toque em <b>Compartilhar</b> ⬆ na barra do Safari<br>
      2. Escolha <b>Adicionar à Tela de Início</b><br>
      3. Confirme em <b>Adicionar</b></div>`;
  } else if (ehIOS) {
    alvo.innerHTML = '<div style="color:var(--text2);font-size:.9rem;margin-top:8px">No iPhone, abra este link no <b>Safari</b> para instalar o app.</div>';
  } else {
    alvo.innerHTML = `<div style="color:var(--text2);font-size:.9rem;margin-top:8px">
      Use o menu do navegador (⋮) e toque em <b>Instalar aplicativo</b>.</div>`;
  }
}

async function instalarAgora(btn) {
  if (!promptInstalar) return;
  btn.disabled = true;
  promptInstalar.prompt();
  const escolha = await promptInstalar.userChoice.catch(() => null);
  promptInstalar = null;
  if (escolha?.outcome === 'accepted') {
    btn.textContent = '✔ Instalado!';
    document.getElementById('banner-instalar').style.display = 'none';
  } else { btn.disabled = false; renderBotaoInstalar(btn.parentElement.id); }
}

function dispensarInstalacao() {
  localStorage.setItem('move_cli_dispensou', '1');
  document.getElementById('banner-instalar').style.display = 'none';
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
document.getElementById('in-cpf')?.addEventListener('input', e => {
  const d = soDigitos(e.target.value).slice(0, 11);
  e.target.value = d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
                    .replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
});
document.getElementById('in-codigo')?.addEventListener('input', e => {
  e.target.value = soDigitos(e.target.value).slice(0, 6);
  if (e.target.value.length === 6) entrar();
});

if (S.token && S.cliente) abrirPropaganda(abrirApp);   // abertura antes da tela principal
else document.getElementById('tela-login').style.display = 'block';

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/app/sw.js', { scope: '/app' }).catch(() => {}));
}
</script>

</html>
